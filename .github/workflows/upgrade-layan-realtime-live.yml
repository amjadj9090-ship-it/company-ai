name: Upgrade Layan to Realtime Live

on:
  push:
    branches: [main]
    paths:
      - 'layan-realtime.trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Layan voice engine with Realtime WebRTC
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          p = Path('companyai_v9_optimized.html')
          s = p.read_text(encoding='utf-8')
          marker = 'company-ai-build: layan-realtime-live-v1-2026-09-12'
          if marker in s:
              print('Realtime upgrade already applied')
              raise SystemExit(0)

          start = r'''function startLayanVoice(){
            if(window.__layanRealtimeConnected||window.__layanRealtimeConnecting)return;
            window.__layanRealtimeConnecting=true;
            setLayanState('جاري فتح الاتصال المباشر…','اسمح للمتصفح باستخدام الميكروفون، وبعدها احكي بشكل طبيعي بدون ضغط زر لكل جملة.');
            (async()=>{
              try{
                const tokenRes=await fetch(API+'/api/voice-avatar/public-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang,channel:'layan',assistant:'layan'})});
                if(!tokenRes.ok)throw Error('voice_session_unavailable');
                const tokenData=await tokenRes.json();
                function findSecret(x){
                  if(!x||typeof x!=='object')return null;
                  if(typeof x==='string')return x;
                  const keys=['client_secret','clientSecret','ephemeral_key','ephemeralKey','token','value'];
                  for(const k of keys){const v=x[k];if(typeof v==='string'&&v.length>20)return v;if(v&&typeof v==='object'&&typeof v.value==='string')return v.value;}
                  for(const k of Object.keys(x)){const v=x[k];if(v&&typeof v==='object'){const z=findSecret(v);if(z)return z;}}
                  return null;
                }
                const ephemeral=findSecret(tokenData);
                if(!ephemeral)throw Error('voice_session_token_missing');
                const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
                const pc=new RTCPeerConnection();
                const audio=document.createElement('audio');audio.autoplay=true;audio.playsInline=true;audio.style.display='none';document.body.appendChild(audio);
                stream.getTracks().forEach(t=>pc.addTrack(t,stream));
                const dc=pc.createDataChannel('oai-events');
                window.__layanRealtime={pc,dc,stream,audio};
                window.__layanRealtimeConnected=true;
                const s=document.getElementById('layanVoiceStage');
                if(s){s.classList.add('listening');}
                setLayanState('ليان تسمعك الآن…','احكي بشكل طبيعي. ما في داعي تضغط أي زر بين الجمل.');
                pc.ontrack=e=>{audio.srcObject=e.streams[0];audio.play().catch(()=>{});};
                pc.onconnectionstatechange=()=>{
                  if(!window.__layanRealtimeConnected)return;
                  if(['failed','disconnected','closed'].includes(pc.connectionState))setLayanState('انقطع الاتصال','حاول إنهاء الجلسة وابدأ جلسة صوتية جديدة.');
                };
                dc.onopen=()=>{
                  dc.send(JSON.stringify({type:'session.update',session:{type:'realtime',instructions:'أنت ليان، المساعدة الصوتية الرسمية لـ Company AI. تحدث بالعربية الشامية عندما يتحدث العميل بالعربية، وبنفس لغة العميل عندما يستخدم لغة أخرى. كن طبيعية، مختصرة، ودودة، وركزي على فهم هدف العميل ومساعدته في الخطوة التالية. لا تنفذي أي التزام مالي أو قانوني أو عقد أو تحويل أو سحب؛ هذه العمليات تحتاج موافقة المالك.',output_modalities:['audio'],audio:{input:{turn_detection:{type:'semantic_vad',eagerness:'auto',create_response:true,interrupt_response:true},transcription:{model:'gpt-4o-transcribe'}},output:{voice:'marin'}}}}));
                };
                let transcript='';
                dc.onmessage=e=>{
                  try{
                    const ev=JSON.parse(e.data);window.__layanRealtimeLastEvent=ev.type;
                    if(ev.type==='input_audio_buffer.speech_started'){
                      transcript='';s?.classList.remove('speaking');s?.classList.add('listening');setLayanState('ليان تسمعك…','احكي بشكل طبيعي، وليان رح تقاطع ردها إذا بلشت تحكي.');
                    }else if(ev.type==='input_audio_buffer.speech_stopped'){
                      s?.classList.remove('listening');setLayanState('ليان تحلل…','لحظة، عم أفهم طلبك وأجهز الرد.');
                    }else if(ev.type==='conversation.item.input_audio_transcription.completed'&&ev.transcript){
                      transcript=ev.transcript;const t=document.getElementById('layanVoiceText');if(t)t.textContent=ev.transcript;
                    }else if(ev.type==='response.created'){
                      s?.classList.remove('listening');s?.classList.add('speaking');startLayanMouth();setLayanState('ليان تتحدث…','إذا بدك تقاطعها، احكي مباشرة — رح تسمعك وتوقف ردها.');
                    }else if(ev.type==='response.audio_transcript.delta'&&ev.delta){
                      const t=document.getElementById('layanVoiceText');if(t)t.textContent=(t.textContent||'')+ev.delta;
                    }else if(ev.type==='response.audio_transcript.done'&&ev.transcript){
                      const t=document.getElementById('layanVoiceText');if(t)t.textContent=ev.transcript;
                    }else if(ev.type==='response.done'){
                      stopLayanMouth();s?.classList.remove('speaking');s?.classList.add('listening');setLayanState('ليان تسمعك الآن…','كمل حديثك بشكل طبيعي.');
                    }else if(ev.type==='error'){
                      console.error('Layan Realtime error',ev);stopLayanMouth();s?.classList.remove('speaking','listening');setLayanState('حدث خطأ في الاتصال','يمكن إعادة المحاولة بإنهاء الجلسة وفتحها من جديد.');
                    }
                  }catch(err){console.warn('Layan realtime event parse error',err);}
                };
                const offer=await pc.createOffer();await pc.setLocalDescription(offer);
                const answer=await fetch('https://api.openai.com/v1/realtime/calls',{method:'POST',headers:{Authorization:'Bearer '+ephemeral,'Content-Type':'application/sdp'},body:offer.sdp});
                if(!answer.ok)throw Error('realtime_sdp_failed');
                await pc.setRemoteDescription({type:'answer',sdp:await answer.text()});
              }catch(err){
                console.error('Layan Realtime startup failed',err);window.__layanRealtimeConnected=false;window.__layanRealtimeConnecting=false;stopLayanVoice();setLayanState('تعذر تشغيل المحادثة المباشرة','تأكد من إذن الميكروفون ومن اتصال خدمة الصوت.');
                return;
              }
              window.__layanRealtimeConnecting=false;
            })();
          }
          '''

          stop = r'''function stopLayanVoice(){
            try{
              const rt=window.__layanRealtime;
              if(rt){try{rt.dc&&rt.dc.close()}catch(e){}try{rt.pc&&rt.pc.close()}catch(e){}try{rt.stream&&rt.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{rt.audio&&rt.audio.remove()}catch(e){}}
            }catch(e){}
            window.__layanRealtime=null;window.__layanRealtimeConnected=false;window.__layanRealtimeConnecting=false;layanRecording=false;stopLayanMouth();
            const s=document.getElementById('layanVoiceStage');if(s)s.classList.remove('listening','speaking');
            if(document.getElementById('layanStart'))document.getElementById('layanStart').textContent='🎙️ جلسة لايف';
          }
          '''

          s2, n1 = re.subn(r'function startLayanVoice\(\)\{.*?\nfunction stopLayanVoice', start + '\nfunction stopLayanVoice', s, count=1, flags=re.S)
          if n1 != 1: raise SystemExit('Could not locate startLayanVoice')
          s3, n2 = re.subn(r'function stopLayanVoice\(\)\{.*?\nfunction toggleLayanVoice', stop + '\nfunction toggleLayanVoice', s2, count=1, flags=re.S)
          if n2 != 1: raise SystemExit('Could not locate stopLayanVoice')
          s3 = s3.replace("function toggleLayanVoice(){if(layanRecording)stopLayanVoice();else startLayanVoice();}", "function toggleLayanVoice(){if(window.__layanRealtimeConnected||window.__layanRealtimeConnecting)stopLayanVoice();else startLayanVoice();}")
          s3 = s3.replace("<button class=\"layanStart\" id=\"layanStart\" onclick=\"toggleLayanVoice()\">🎙️ تحدث مع ليان</button>", "<button class=\"layanStart\" id=\"layanStart\" onclick=\"toggleLayanVoice()\">🎙️ جلسة لايف</button>")
          s3 += '\n<!-- '+marker+' -->\n'
          p.write_text(s3,encoding='utf-8')
          subprocess.run(['git','config','user.name','company-ai-bot'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','companyai_v9_optimized.html'],check=True)
          subprocess.run(['git','commit','-m','Switch Layan voice to realtime WebRTC live conversation'],check=True)
          subprocess.run(['git','push'],check=True)

      - name: Deploy updated site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
