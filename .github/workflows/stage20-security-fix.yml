name: Stage 20 Security Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage20-security-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden production configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/main.py')
          s = p.read_text(encoding='utf-8')
          old = "COMPANY_OWNER_EMAIL=os.getenv('COMPANY_OWNER_EMAIL','owner@example.com').strip().lower()\nif os.getenv('ENVIRONMENT','development')=='production' and len(JWT_SECRET)<32: raise RuntimeError('JWT_SECRET must be at least 32 characters in production')\nif os.getenv('ENVIRONMENT','development')=='production' and os.getenv('PASSWORD_PEPPER','') in ('','dev-pepper'): raise RuntimeError('PASSWORD_PEPPER must be configured in production')"
          new = "ENVIRONMENT=os.getenv('ENVIRONMENT','development').strip().lower()\nCOMPANY_OWNER_EMAIL=os.getenv('COMPANY_OWNER_EMAIL','owner@example.com').strip().lower()\nif ENVIRONMENT=='production' and len(JWT_SECRET)<32: raise RuntimeError('JWT_SECRET must be at least 32 characters in production')\nif ENVIRONMENT=='production' and os.getenv('PASSWORD_PEPPER','') in ('','dev-pepper'): raise RuntimeError('PASSWORD_PEPPER must be configured in production')\nif ENVIRONMENT=='production' and (os.getenv('DEMO_ADMIN_PASSWORD','') in ('','change-me') or len(os.getenv('DEMO_ADMIN_PASSWORD','')) < 16): raise RuntimeError('DEMO_ADMIN_PASSWORD must be configured with at least 16 characters in production')\nif ENVIRONMENT=='production' and COMPANY_OWNER_EMAIL=='owner@example.com': raise RuntimeError('COMPANY_OWNER_EMAIL must be configured in production')"
          if old not in s:
              raise SystemExit('expected production guard block not found')
          s = s.replace(old, new, 1)
          old = "origins=[x.strip() for x in os.getenv('CORS_ORIGINS','http://localhost:8000,http://localhost:5173').split(',') if x.strip()]"
          new = "default_origins='' if ENVIRONMENT=='production' else 'http://localhost:8000,http://localhost:5173'\norigins=[x.strip() for x in os.getenv('CORS_ORIGINS',default_origins).split(',') if x.strip()]"
          if old not in s:
              raise SystemExit('expected CORS configuration not found')
          s = s.replace(old, new, 1)
          old = "owner_password=os.getenv('DEMO_ADMIN_PASSWORD','change-me')"
          new = "owner_password=os.getenv('DEMO_ADMIN_PASSWORD','')"
          if old not in s:
              raise SystemExit('expected admin password default not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify hardened source
        run: |
          grep -q "DEMO_ADMIN_PASSWORD must be configured with at least 16 characters in production" backend/app/main.py
          grep -q "COMPANY_OWNER_EMAIL must be configured in production" backend/app/main.py
          grep -q "default_origins='' if ENVIRONMENT=='production'" backend/app/main.py
          grep -q "owner_password=os.getenv('DEMO_ADMIN_PASSWORD','')" backend/app/main.py

      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          if git diff --cached --quiet; then
            echo 'No hardening changes required'
            exit 0
          fi
          git commit -m 'fix: harden production secret and CORS defaults'
          git push

      # Stage 20 trigger marker: changing this workflow file intentionally reruns the hardening pass.
