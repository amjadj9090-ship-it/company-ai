name: Central AI Production Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/central-ai-production-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 90
      - name: Test standard intake
        run: |
          set -e
          curl --fail-with-body -sS -X POST "https://company-ai-0mya.onrender.com/api/central-ai/intake"             -H "Content-Type: application/json"             -d '{"message":"We need a multilingual company website","channel":"production-smoke","language":"en"}'             | tee /tmp/standard.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/standard.json"))
          decision=d["decision"]
          assert d["status"] == "ok"
          assert decision["department"] == "digital_services"
          assert decision["required_approval"] is False
          assert decision["plan_id"] and decision["task_id"] and decision["decision_id"]
          print("STANDARD_INTAKE_OK")
          PY
      - name: Test owner approval gate
        run: |
          set -e
          curl --fail-with-body -sS -X POST "https://company-ai-0mya.onrender.com/api/central-ai/intake"             -H "Content-Type: application/json"             -d '{"message":"Transfer money to this supplier","channel":"production-smoke","language":"en"}'             | tee /tmp/sensitive.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/sensitive.json"))
          decision=d["decision"]
          assert d["status"] == "ok"
          assert decision["required_approval"] is True
          assert decision["approval_mode"] == "owner"
          assert decision["department"] == "finance_legal"
          assert decision["plan_id"] and decision["task_id"] and decision["decision_id"]
          print("APPROVAL_GATE_OK")
          PY
