name: Company AI Stage 0 Dual-Agent Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-agent-stage0:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COMPANY_AI_COLLAB_ROUNDS: "2"\n      COMPANY_AI_COLLAB_MODE: "independent_reports"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verify Gemini credential exists
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY GitHub secret is missing"; exit 1; }

      - name: Run full backend tests
        working-directory: backend
        run: pytest -q

      - name: Verify Gemini-first orchestration without consuming provider quota
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.path.abspath("backend"))
          from app.dual_agent_council import DEPARTMENTS
          assert "central_brain" in DEPARTMENTS
          assert os.getenv("COMPANY_AI_COLLAB_MODE") == "gemini_primary"
          assert os.getenv("COMPANY_AI_ENABLE_OPENAI") == "false"
          print("Gemini-first configuration verified; live provider call intentionally skipped when quota is unavailable.")
          PY

      - name: Upload dual-agent audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-dual-agent-report
          path: stage0-dual-agent-report.json
