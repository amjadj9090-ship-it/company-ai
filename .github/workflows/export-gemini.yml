name: Export project archive for Gemini
on:
  push:
    branches:
      - company-ai-launch-build-backup-20260920
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create archive
        run: |
          zip -r /tmp/company-ai-launch-build.zip . -x '.git/*' '.github/workflows/export-gemini.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: company-ai-launch-build
          path: /tmp/company-ai-launch-build.zip
          retention-days: 1