name: Deploy Layan Realtime Hotfix v4

on:
  push:
    branches: [main]
    paths:
      - 'frontend/layan-realtime-hotfix.js'
      - '.github/workflows/deploy-layan-hotfix-v4.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-layan-hotfix-v4
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build and validate
        run: |
          set -e
          test -s companyai_v9_optimized.html
          test -s frontend/layan-realtime-hotfix.js
          mkdir -p frontend/assets
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          raw=Path('assets/layan-office.webp.txt').read_text(encoding='utf-8')
          raw=re.sub(r'[^A-Za-z0-9+/=]','',raw); raw += '='*((-len(raw))%4)
          data=base64.b64decode(raw,validate=False)
          if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]: raise SystemExit('Invalid office asset')
          Path('frontend/assets/layan-office.webp').write_bytes(data)
          Path('frontend/index.html').write_text(Path('companyai_v9_optimized.html').read_text(encoding='utf-8'),encoding='utf-8')
          p=Path('frontend/index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="layan-realtime-hotfix.js"></script>'
          if tag not in s: s=s.replace('</body>',tag+'\n</body>',1)
          s += '\n<!-- company-ai-build: layan-ga-realtime-hotfix-v4-2026-09-12 -->\n'
          p.write_text(s,encoding='utf-8')
          PY
          node --check frontend/layan-realtime-hotfix.js
          grep -q 'api/voice-avatar/public-session' frontend/layan-realtime-hotfix.js
          grep -q 'v1/realtime/calls' frontend/layan-realtime-hotfix.js
          grep -q 'interrupt_response' frontend/layan-realtime-hotfix.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
