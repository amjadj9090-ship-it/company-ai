name: Deploy Company AI Pages v12

on:
  push:
    branches: [main]
    paths:
      - 'frontend/layan-realtime-hotfix.js'
      - 'frontend/layan-realtime-lock-v11.js'
      - 'frontend/layan-realtime-guard-v12.js'
      - '.github/workflows/deploy-pages-hotfix-v9b.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare hotfix frontend
        run: |
          set -e
          test -s frontend/index.html
          test -s frontend/layan-realtime-hotfix.js
          test -s frontend/layan-realtime-lock-v11.js
          test -s frontend/layan-realtime-guard-v12.js
          mkdir -p frontend/assets
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          raw=Path('assets/layan-office.webp.txt').read_text(encoding='utf-8')
          raw=re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          raw += '='*((-len(raw))%4)
          data=base64.b64decode(raw, validate=False)
          if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]: raise SystemExit('Invalid Layan office image data')
          Path('frontend/assets/layan-office.webp').write_bytes(data)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script[^>]+layan-realtime-hotfix\.js\?v=[^"\']+["\'][^>]*></script>\s*','',s,flags=re.I)
          s=re.sub(r'<script[^>]+layan-realtime-lock-v11\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          s=re.sub(r'<script[^>]+layan-realtime-guard-v12\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          s=s.replace('</body>','<script src="layan-realtime-hotfix.js?v=20260912-v12"></script>\n<script src="layan-realtime-lock-v11.js?v=20260912-v12"></script>\n<script src="layan-realtime-guard-v12.js?v=20260912-v12"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'layan-realtime-hotfix.js?v=20260912-v12' frontend/index.html
          grep -q 'layan-realtime-lock-v11.js?v=20260912-v12' frontend/index.html
          grep -q 'layan-realtime-guard-v12.js?v=20260912-v12' frontend/index.html
          node --check frontend/layan-realtime-hotfix.js
          node --check frontend/layan-realtime-lock-v11.js
          node --check frontend/layan-realtime-guard-v12.js
          grep -q 'RTCPeerConnection' frontend/layan-realtime-hotfix.js
          grep -q 'getUserMedia' frontend/layan-realtime-hotfix.js
          grep -q '/v1/realtime/calls' frontend/layan-realtime-hotfix.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
