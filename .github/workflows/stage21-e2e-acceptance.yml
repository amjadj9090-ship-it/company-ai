# Stage 21 final acceptance run against the latest production voice fix
name: Stage 21 E2E Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production E2E acceptance
        env:
          BASE_URL: https://company-ai-0mya.onrender.com
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.BASE_URL;
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']});
            const page = await browser.newPage({viewport:{width:390,height:844},locale:'ar-SA'});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
            let health;
            for (let attempt=1; attempt<=24; attempt++) {
              try {
                health=await page.request.get(`${base}/healthz`, {timeout:5000});
                if(health.ok()) break;
              } catch (_) {}
              await new Promise(r=>setTimeout(r,5000));
            }
            if(!health || !health.ok()) throw new Error(`healthz failed after waiting for latest deploy: ${health&&health.status()}`);
            await new Promise(r=>setTimeout(r,10000));
            const healthJson=await health.json();
            if(healthJson.status!=='ok'||healthJson.mode!=='production') throw new Error(`unexpected health: ${JSON.stringify(healthJson)}`);
            const response=await page.goto(base,{waitUntil:'networkidle'});
            if(!response||!response.ok()) throw new Error(`homepage failed: ${response&&response.status()}`);
            const pp=response.headers()['permissions-policy']||'';
            const csp=response.headers()['content-security-policy']||'';
            const micAllowed=await page.evaluate(()=>document.permissionsPolicy?.allowsFeature?.('microphone') ?? null);
            console.log(`PERMISSIONS_POLICY=${pp}`);
            console.log(`MICROPHONE_ALLOWED=${micAllowed}`);
            if((await page.title())!=='COMPANY AI — Global Business OS') throw new Error('unexpected page title');
            if(!(await page.locator('.layanHero').count())) throw new Error('Layan hero missing');
            if((await page.locator('.layanChoice').count())<2) throw new Error('Layan interaction choices missing');
            if(!(await page.locator('.voiceChoice').count())) throw new Error('voice choice missing');
            if(!(await page.locator('script[src*="layan-realtime-hotfix.js"]').count())) throw new Error('Layan realtime script missing');
            if(!(await page.locator('script[src*="company-ai-live-bridge.js"]').count())) throw new Error('live bridge script missing');
            await page.locator('#aiModal.open .close').first().evaluate(el=>el.click()).catch(()=>{});
            await page.locator('#aiModal.open').evaluate(el=>el.classList.remove('open')).catch(()=>{});
            await page.locator('.voiceChoice').first().evaluate(el=>el.click());
            const realtimeOverlay=page.locator('#layanRealtimeHotfix.open');
            const legacyStage=page.locator('.layanVoiceStage.open');
            await Promise.race([realtimeOverlay.waitFor({state:'visible',timeout:7000}),legacyStage.waitFor({state:'visible',timeout:7000})]).catch(()=>{});
            if(!(await realtimeOverlay.count())&&!(await legacyStage.count())) throw new Error('Layan voice UI did not open');
            if(await realtimeOverlay.count()){
              if(!(await page.locator('#lhStatus').count())) throw new Error('realtime voice status missing');
              if(!(await page.locator('#lhEnd').count())) throw new Error('realtime voice end control missing');
              await page.waitForFunction(() => { const el=document.querySelector('#lhStatus'); const t=(el?.textContent||'').trim(); return /^لايف\s*[—-]\s*احكي مع ليان$/.test(t) || t.includes('تم الاتصال بليان'); }, {timeout:20000});
              console.log(`REALTIME_HANDSHAKE_STATUS=${await page.locator('#lhStatus').textContent()}`);
              await page.locator('#lhClose').evaluate(el=>el.click());
              await realtimeOverlay.waitFor({state:'hidden',timeout:5000}).catch(()=>{});
              if(await page.locator('#layanRealtimeHotfix.open').count()) throw new Error('realtime voice overlay did not close');
            } else {
              if(!(await page.locator('.layanVoicePortrait').count())) throw new Error('legacy voice portrait missing');
              if(!(await page.locator('.layanVoicePanel').count())) throw new Error('legacy voice panel missing');
              await page.locator('.layanClose').first().evaluate(el=>el.click());
              if((await page.locator('.layanVoiceStage.open').count())!==0) throw new Error('legacy voice stage did not close');
            }
            if(!csp) throw new Error('CSP response header missing');
            if(errors.length) throw new Error(`browser console/page errors: ${errors.join(' | ')}`);
            console.log('STAGE21_E2E_ACCEPTANCE=PASS');
            console.log('healthz=PASS');
            console.log('homepage=PASS');
            console.log('layan_ui=PASS');
            console.log('voice_ui_open_close=PASS');
            console.log('security_csp=PASS');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
