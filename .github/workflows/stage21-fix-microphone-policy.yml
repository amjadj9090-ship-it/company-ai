name: Stage 21 Microphone Policy Fix

on:
  push:
    branches: [main]

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: allow microphone for Layan voice') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch microphone Permissions-Policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/main.py')
          s = p.read_text(encoding='utf-8')
          old = "response.headers['Permissions-Policy']='camera=(), geolocation=(), payment=(), usb=()'"
          new = "response.headers['Permissions-Policy']='camera=(), geolocation=(), microphone=(self), payment=(), usb=()'"
          if old not in s:
              raise SystemExit('Expected Permissions-Policy line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/stage21-fix-microphone-policy.yml
          git config user.name "company-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py .github/workflows/stage21-fix-microphone-policy.yml
          git commit -m "fix: allow microphone for Layan voice"
          git push
