name: Stage 20 Production Init Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move production credential requirements to first-owner creation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/main.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if ENVIRONMENT=='production' and (os.getenv('DEMO_ADMIN_PASSWORD','') in ('','change-me') or len(os.getenv('DEMO_ADMIN_PASSWORD','')) < 16): raise RuntimeError('DEMO_ADMIN_PASSWORD must be configured with at least 16 characters in production')\n", "")
          s=s.replace("if ENVIRONMENT=='production' and COMPANY_OWNER_EMAIL=='owner@example.com': raise RuntimeError('COMPANY_OWNER_EMAIL must be configured in production')\n", "")
          old="    owner=s.scalar(select(UserRow).where(UserRow.email==owner_email))\n    if not owner:\n        s.add(UserRow(name='Owner',email=owner_email,password_hash=pwd_hash(owner_password),role='admin',active=True))"
          new="    owner=s.scalar(select(UserRow).where(UserRow.email==owner_email))\n    if not owner:\n        if ENVIRONMENT=='production' and (owner_email=='owner@example.com' or len(owner_password)<16 or owner_password=='change-me'):\n            raise RuntimeError('Production owner credentials must be configured before first owner creation')\n        s.add(UserRow(name='Owner',email=owner_email,password_hash=pwd_hash(owner_password),role='admin',active=True))"
          if old not in s: raise SystemExit('seed owner block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          ! grep -q "DEMO_ADMIN_PASSWORD must be configured with at least 16 characters in production" backend/app/main.py
          grep -q "Production owner credentials must be configured before first owner creation" backend/app/main.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          git commit -m 'fix: require production owner credentials only on first creation' || exit 0
          git push
