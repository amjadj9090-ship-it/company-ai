name: Deploy Company AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'companyai_v9_optimized.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages and enable it
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build latest Company AI frontend
        run: |
          set -e
          test -s companyai_v9_optimized.html
          cp companyai_v9_optimized.html frontend/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("applyLang();setTimeout(()=>{if(!sessionStorage.getItem('company_ai_intro_seen')){openAI();sessionStorage.setItem('company_ai_intro_seen','1')}},900);", "applyLang();")
          s=s.replace("function escapeHtml(s){return s.replace(", "function escapeHtml(s){return String(s??'').replace(")
          s=s.replace('<footer class="footer"><div class="wrap"><a href="admin.html" style="color:inherit">دخول إدارة Company AI</a> · <div class="wrap">© 2026 COMPANY AI — Digital • AI • Global Business</div></footer>', '<footer class="footer"><div class="wrap"><a href="admin.html" style="color:inherit">دخول إدارة Company AI</a> · © 2026 COMPANY AI — Digital • AI • Global Business</div></footer>')

          css='''
          <style id="company-ai-layan-live-fix">
          .layanVoicePortraitWrap{animation-play-state:running!important;will-change:transform}
          .layanVoiceStage.speaking .layanVoicePortraitWrap{animation:layanHeadTalk .58s ease-in-out infinite alternate!important}
          .layanVoiceStage.listening .layanVoicePortraitWrap{animation:layanHeadListen .95s ease-in-out infinite alternate!important}
          .layanVoiceStage.speaking .layanEye{animation:layanEyeLook 1.5s ease-in-out infinite alternate!important}
          .layanVoiceStage.speaking .layanBlink,.layanVoiceStage.listening .layanBlink{animation:layanBlink 3.4s ease-in-out infinite!important}
          .layanVoiceStage.speaking .layanMouthRig{opacity:.72!important;animation:layanMouthLive .13s steps(2,end) infinite!important}
          .layanVoiceStage.speaking .layanHeadHint{animation:layanShoulder .8s ease-in-out infinite alternate!important;opacity:.16!important}
          .layanLanguagePill{display:inline-flex;align-items:center;gap:7px;margin:10px auto 0;padding:7px 11px;border-radius:999px;background:#eaf3ff;color:#2252a3;font-size:12px;font-weight:800}
          .layanChoice,.layanQuickText,.layanQuickVoice{pointer-events:auto!important;touch-action:manipulation!important}
          </style>
          '''
          s=s.replace('</head>', css+'\n</head>', 1)

          runtime='''
          /* Company AI Layan live-runtime repair */
          (function(){
            function ready(){
              try{
                document.querySelectorAll('.layanChoice.textChoice,.layanQuickText').forEach(function(b){
                  b.addEventListener('click',function(e){
                    e.preventDefault();
                    if(typeof window.openAI==='function')window.openAI();
                  },{passive:false});
                });
                document.querySelectorAll('.layanChoice.voiceChoice,.layanQuickVoice').forEach(function(b){
                  b.addEventListener('click',function(e){
                    e.preventDefault();
                    if(typeof window.openLayanVoice==='function')window.openLayanVoice();
                  },{passive:false});
                });
                var hero=document.querySelector('.layanWelcome');
                if(hero&&!hero.querySelector('.layanLanguagePill')){
                  var p=document.createElement('div');
                  p.className='layanLanguagePill';
                  p.id='layanLanguagePill';
                  hero.appendChild(p);
                }
                var names={ar:'العربية',en:'English',fr:'Français',de:'Deutsch',es:'Español',it:'Italiano',pt:'Português',tr:'Türkçe',nl:'Nederlands',zh:'中文',ru:'Русский',ja:'日本語',ko:'한국어'};
                var p=document.getElementById('layanLanguagePill');
                if(p){
                  var code=(document.documentElement.lang||'en').split('-')[0];
                  p.textContent='🌐 '+(names[code]||code);
                }
                if(typeof window.applyLang==='function')window.applyLang();
              }catch(e){console.warn('Company AI Layan live fix',e);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
          })();
          '''
          marker='/* Company AI Layan live-runtime repair */'
          if marker not in s:
              s=s.replace('</script>', runtime+'</script>', 1)
          s=s.replace('@media (prefers-reduced-motion:reduce){.layanVoicePortraitWrap,.layanEye,.layanBlink,.layanMouthRig,.layanHeadHint{animation:none!important}}','')
          s += '\n<!-- company-ai-build: layan-live-2026-09-12 -->\n'
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          if len(scripts)!=2: raise SystemExit(f'Expected two script blocks, got {len(scripts)}')
          for i,body in enumerate(scripts,1): Path(f'/tmp/company_ai_{i}.js').write_text(body,encoding='utf-8')
          if s.lower().count('<html')!=1 or s.lower().count('</html>')!=1 or s.lower().count('<body')!=1 or s.lower().count('</body>')!=1: raise SystemExit('Malformed HTML shell')
          PY
          node --check /tmp/company_ai_1.js
          node --check /tmp/company_ai_2.js
          grep -q 'layanVoiceStage' frontend/index.html
          grep -q 'startLayanVoice' frontend/index.html
          grep -q 'owner-dashboard' frontend/index.html
          grep -q 'company_ai_crm_v1' frontend/index.html
          grep -q 'company-ai-build: layan-live-2026-09-12' frontend/index.html

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
