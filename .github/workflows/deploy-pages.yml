name: Deploy Company AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'companyai_v9_optimized.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages and enable it
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact from the latest Company AI frontend
        run: |
          set -e
          test -s companyai_v9_optimized.html
          cp companyai_v9_optimized.html frontend/index.html
          grep -q 'layanVoiceStage' frontend/index.html
          grep -q 'startLayanVoice' frontend/index.html
          grep -q 'owner-dashboard' frontend/index.html
          grep -q 'company_ai_crm_v1' frontend/index.html

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
