name: Deploy Company AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'companyai_v9_optimized.html'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare and validate Company AI frontend
        run: |
          set -euo pipefail
          test -s frontend/index.html
          test -s frontend/layan-realtime-hotfix.js
          test -s assets/layan-office.webp.txt
          mkdir -p frontend/assets
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          raw=Path('assets/layan-office.webp.txt').read_text(encoding='utf-8')
          raw=re.sub(r'[^A-Za-z0-9+/=]','',raw)
          raw += '='*((-len(raw))%4)
          data=base64.b64decode(raw,validate=False)
          if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]: raise SystemExit('Invalid Layan office image data')
          Path('frontend/assets/layan-office.webp').write_bytes(data)
          PY
          test -s frontend/assets/layan-office.webp
          node --check frontend/layan-realtime-hotfix.js
          grep -q 'RTCPeerConnection' frontend/layan-realtime-hotfix.js
          grep -q 'getUserMedia' frontend/layan-realtime-hotfix.js
          grep -q 'stopImmediatePropagation' frontend/layan-realtime-hotfix.js
          grep -q 'layan-realtime-hotfix.js?v=20260912-v8' frontend/index.html
          grep -q 'layanOfficePortrait' frontend/index.html
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
