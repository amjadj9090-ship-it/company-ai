name: Deploy Company AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'companyai_v9_optimized.html'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate Company AI frontend
        run: |
          set -euo pipefail
          test -s frontend/index.html
          test -s frontend/layan-realtime-hotfix.js
          node --check frontend/layan-realtime-hotfix.js
          grep -q 'RTCPeerConnection' frontend/layan-realtime-hotfix.js
          grep -q 'getUserMedia' frontend/layan-realtime-hotfix.js
          grep -q 'stopImmediatePropagation' frontend/layan-realtime-hotfix.js
          grep -Eq 'layan-realtime-hotfix\.js([?][^"'"'"']*)?["'"'"']' frontend/index.html
      - name: Upload frontend exactly as tested
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
