name: Deploy Company AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'companyai_v9_optimized.html'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages and enable it
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build latest Company AI frontend
        run: |
          set -e
          test -s companyai_v9_optimized.html
          test -s assets/layan-office.webp.txt
          mkdir -p frontend/assets
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          raw=Path('assets/layan-office.webp.txt').read_text(encoding='utf-8')
          raw=re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          raw += '='*((-len(raw))%4)
          data=base64.b64decode(raw, validate=False)
          if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]: raise SystemExit('Invalid Layan office image data')
          Path('frontend/assets/layan-office.webp').write_bytes(data)
          PY
          test -s frontend/assets/layan-office.webp
          cp companyai_v9_optimized.html frontend/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("applyLang();setTimeout(()=>{if(!sessionStorage.getItem('company_ai_intro_seen')){openAI();sessionStorage.setItem('company_ai_intro_seen','1')}},900);", "applyLang();")
          s=s.replace("function escapeHtml(s){return s.replace(", "function escapeHtml(s){return String(s??'').replace(")
          s=s.replace("u.rate=.94;u.pitch=1.02;", "u.rate=.90;u.pitch=1.00;")
          s=s.replace('<footer class="footer"><div class="wrap"><a href="admin.html" style="color:inherit">دخول إدارة Company AI</a> · <div class="wrap">© 2026 COMPANY AI — Digital • AI • Global Business</div></footer>', '<footer class="footer"><div class="wrap"><a href="admin.html" style="color:inherit">دخول إدارة Company AI</a> · © 2026 COMPANY AI — Digital • AI • Global Business</div></footer>')
          office_css='''
          <style id="company-ai-layan-two-image-fix">
          .layanOfficePortrait{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;transition:opacity .28s ease,transform .28s ease;transform:scale(.995);filter:drop-shadow(0 30px 60px rgba(0,0,0,.5));z-index:2}
          .layanVoiceStage.speaking .layanOfficePortrait{opacity:1;transform:scale(1)}
          .layanVoiceStage.speaking .layanVoicePortrait{opacity:0}
          .layanVoicePortrait{transition:opacity .28s ease,transform .25s}
          </style>
          '''
          s=s.replace('</head>', office_css+'\n</head>', 1)
          needle='class="layanVoicePortrait"'
          m=re.search(r'<img\s+class="layanVoicePortrait"[^>]*>',s)
          if not m: raise SystemExit('Main Layan voice portrait image not found')
          main_img=m.group(0)
          if 'assets/layan-office.webp' in main_img: raise SystemExit('Main portrait was already replaced; refusing unsafe swap')
          office_img='<img class="layanOfficePortrait" src="assets/layan-office.webp" alt="Layan in the Company AI office" aria-hidden="true">'
          s=s[:m.end()]+office_img+s[m.end():]
          runtime='''
          /* Company AI Layan live-runtime repair */
          (function(){
            function ready(){
              try{
                document.querySelectorAll('.layanChoice.textChoice,.layanQuickText').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();if(typeof window.openAI==='function')window.openAI();},{passive:false});});
                document.querySelectorAll('.layanChoice.voiceChoice,.layanQuickVoice').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();if(typeof window.openLayanVoice==='function')window.openLayanVoice();},{passive:false});});
                var hero=document.querySelector('.layanWelcome');
                if(hero&&!hero.querySelector('.layanLanguagePill')){var p=document.createElement('div');p.className='layanLanguagePill';p.id='layanLanguagePill';hero.appendChild(p);}
                var names={ar:'العربية',en:'English',fr:'Français',de:'Deutsch',es:'Español',it:'Italiano',pt:'Português',tr:'Türkçe',nl:'Nederlands',zh:'中文',ru:'Русский',ja:'日本語',ko:'한국어'};
                var p=document.getElementById('layanLanguagePill');
                if(p){var code=(document.documentElement.lang||'en').split('-')[0];p.textContent='🌐 '+(names[code]||code);}
                if(typeof window.applyLang==='function')window.applyLang();
              }catch(e){console.warn('Company AI Layan live fix',e);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
          })();
          '''
          marker='/* Company AI Layan live-runtime repair */'
          if marker not in s:s=s.replace('</script>', runtime+'</script>', 1)
          s=s.replace('@media (prefers-reduced-motion:reduce){.layanVoicePortraitWrap,.layanEye,.layanBlink,.layanMouthRig,.layanHeadHint{animation:none!important}}','')
          s += '\n<!-- company-ai-build: layan-two-images-speaking-swap-2026-09-12 -->\n'
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          if len(scripts)!=2: raise SystemExit(f'Expected two script blocks, got {len(scripts)}')
          for i,body in enumerate(scripts,1): Path(f'/tmp/company_ai_{i}.js').write_text(body,encoding='utf-8')
          if s.lower().count('<html')!=1 or s.lower().count('</html>')!=1 or s.lower().count('<body')!=1 or s.lower().count('</body>')!=1: raise SystemExit('Malformed HTML shell')
          PY
          node --check /tmp/company_ai_1.js
          node --check /tmp/company_ai_2.js
          grep -q 'layanVoiceStage' frontend/index.html
          grep -q 'class="layanVoicePortrait"' frontend/index.html
          grep -q 'class="layanOfficePortrait"' frontend/index.html
          grep -q 'assets/layan-office.webp' frontend/index.html
          grep -q 'startLayanVoice' frontend/index.html
          grep -q 'owner-dashboard' frontend/index.html
          grep -q 'company_ai_crm_v1' frontend/index.html
          grep -q 'company-ai-build: layan-two-images-speaking-swap-2026-09-12' frontend/index.html

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
