name: Promote Company AI v9

on:
  push:
    paths:
      - 'companyai_v9_optimized.html'
      - '.github/workflows/promote-layan-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair frontend runtime initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('companyai_v9_optimized.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let lang=localStorage.getItem('company_ai_lang')||browserBaseLanguage();", "let lang=browserBaseLanguage();", 1)
          marker='const LAYAN_LANGS='
          pos=s.find(marker)
          init=s.find('let lang=browserBaseLanguage();')
          if pos>init and pos>=0 and init>=0:
              end=s.find('\n',pos)
              if end<0: end=len(s)
              block=s[pos:end+1]
              s=s[:pos]+s[end+1:]
              init=s.find('let lang=browserBaseLanguage();')
              s=s[:init]+block+s[init:]
          s=s.replace('</script></script></body></html>', '</script></body></html>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Repair async JavaScript declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('companyai_v9_optimized.html')
          s=p.read_text(encoding='utf-8')
          # Several frontend handlers use await. A normal function declaration
          # containing await is a SyntaxError and stops the entire main script.
          # Convert every function whose body contains await into an async function.
          matches=list(re.finditer(r'(?<!async )function\\s+([A-Za-z0-9_$]+)\\s*\\([^)]*\\)\\s*\\{',s))
          for m in reversed(matches):
              start=m.end(); depth=1; i=start; found=False
              while i<len(s) and depth:
                  if s[i]=='{': depth+=1
                  elif s[i]=='}': depth-=1
                  i+=1
              if depth==0 and 'await ' in s[start:i-1]:
                  prefix=s[:m.start()]
                  if not prefix.endswith('async '):
                      s=s[:m.start()]+'async '+s[m.start():]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Restore early browser language bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('companyai_v9_optimized.html')
          s=p.read_text(encoding='utf-8')
          boot="""<script>(function(){try{var n=(navigator.languages&&navigator.languages[0]||navigator.language||'en').toLowerCase().split('-')[0];var ok=['ar','en','zh','fr','de','es','it','pt','tr','nl','ru','ja','ko'];if(ok.indexOf(n)<0)n='en';document.documentElement.lang=n;document.documentElement.dir=n==='ar'?'rtl':'ltr';}catch(e){}})();</script>"""
          if 'navigator.languages&&navigator.languages[0]' not in s:
              s=s.replace('</head>',boot+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Patch frontend for reliable first-screen interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('companyai_v9_optimized.html')
          s=p.read_text(encoding='utf-8')
          old='@media(max-width:850px){.layanHero{padding:14px 0 28px}.layanHeroGrid{grid-template-columns:1fr;gap:12px}.layanVisual{min-height:58dvh;border-radius:22px}.layanWelcome{border-radius:22px;padding:20px}'
          new='@media(max-width:850px){.layanHero{padding:14px 0 28px}.layanHeroGrid{grid-template-columns:1fr;gap:12px}.layanVisual{min-height:48dvh;height:48dvh;border-radius:22px}.layanWelcome{border-radius:22px;padding:20px;margin-top:-4px}.layanChoiceGrid{position:relative;z-index:2}'
          if old in s: s=s.replace(old,new,1)
          marker='</section><section class="section" id="services">'
          insert='<div class="layanQuickActions" aria-label="خيارات التفاعل مع ليان"><button type="button" onclick="openAI()">💬 دردشة كتابية مع ليان</button><button type="button" onclick="openLayanVoice()">🎙️ دردشة صوتية مع ليان</button></div></section><section class="section" id="services">'
          if marker in s and 'layanQuickActions' not in s: s=s.replace(marker,insert,1)
          css='''.layanQuickActions{position:absolute;right:18px;left:18px;bottom:82px;display:flex;gap:10px;z-index:4}.layanQuickActions button{flex:1;border:1px solid rgba(255,255,255,.28);background:rgba(7,19,33,.78);backdrop-filter:blur(12px);color:#fff;border-radius:14px;padding:13px 12px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.22)}.layanQuickActions button:hover{background:rgba(20,45,72,.9)}@media(max-width:520px){.layanQuickActions{bottom:72px;flex-direction:column}.layanQuickActions button{padding:11px}.layanVisual{min-height:52dvh;height:52dvh}}\n'''
          if 'layanQuickActions{position:' not in s: s=s.replace('</style>',css+'</style>',1)
          oldcatch="catch(e){const typing=document.getElementById('salesTyping');if(typing)typing.textContent=lang==='ar'?'تعذر الاتصال بموظف المبيعات حالياً.':'Sales employee is temporarily unavailable.'}finally"
          newcatch="""catch(e){const typing=document.getElementById('salesTyping');if(typing){const q=v.toLowerCase();let local=lang==='ar'?'فهمت طلبك. خلينا نحدد هدفك والخطوة التالية، وأنا معك خطوة بخطوة.':'I understood your request. Let’s define the goal and next step together.';if(/موقع|website|web/.test(q))local=lang==='ar'?'ممتاز. ليان بتساعدك بتحديد أهداف الموقع، الصفحات والوظائف المطلوبة، وبعدها مننتقل للتصميم والتطوير والاختبار.':'Great. Layan can help define the website goals, pages and required features, then move to design, development and testing.';else if(/تطبيق|app|application/.test(q))local=lang==='ar'?'ممتاز. منحدد فكرة التطبيق والمستخدمين والوظائف، وبعدها مننتقل للتصميم والتطوير والاختبار.':'Great. We can define the app idea, users and features, then move to design, development and testing.';typing.innerHTML=escapeHtml(local)}}finally"""
          if oldcatch in s: s=s.replace(oldcatch,newcatch,1)
          s=s.replace("document.getElementById('aiTitle').textContent=t.title||T.en.title;document.getElementById('aiGreeting').textContent=t.greet||T.en.greet;document.getElementById('chatInput').placeholder=t.placeholder||T.en.placeholder;", "const a=document.getElementById('aiTitle'),g=document.getElementById('aiGreeting'),c=document.getElementById('chatInput');if(a)a.textContent=t.title||T.en.title;if(g)g.textContent=t.greet||T.en.greet;if(c)c.placeholder=t.placeholder||T.en.placeholder;", 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate frontend JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('companyai_v9_optimized.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          if len(scripts)<2: raise SystemExit(f'Expected bootstrap plus main script, got {len(scripts)}')
          if s.count('</script>') != s.count('<script'):
              raise SystemExit('Unbalanced script tags')
          for i,x in enumerate(scripts): Path(f'/tmp/company_ai_{i}.js').write_text(x,encoding='utf-8')
          required=['openAI','openLayanVoice','startLayanVoice','toggleLayanVoice','answerLayan','speakLayan','askAI']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing functions: '+str(missing))
          if '<body' not in s or '</body>' not in s or '</html>' not in s: raise SystemExit('Malformed HTML shell')
          if s.find('const LAYAN_LANGS=') > s.find('let lang=browserBaseLanguage();'): raise SystemExit('LAYAN_LANGS still declared after language initialization')
          PY
          node --check /tmp/company_ai_0.js
          node --check /tmp/company_ai_1.js

      - name: Promote optimized frontend
        run: cp companyai_v9_optimized.html frontend/index.html

      - name: Commit promoted frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companyai_v9_optimized.html frontend/index.html .github/workflows/promote-layan-v9.yml
          if git diff --cached --quiet; then
            echo "No frontend change to commit."
          else
            git commit -m "Fix Company AI Layan runtime and publish interactive frontend"
            git push
          fi
