name: Production Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production health
        run: |
          set -euo pipefail
          url="https://company-ai-0mya.onrender.com/healthz"
          for i in $(seq 1 30); do
            body="$(curl --silent --show-error --max-time 30 "$url" || true)"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Production health check: OK"
              echo "$body"
              exit 0
            fi
            echo "Waiting for production health (attempt $i/30)"
            sleep 5
          done
          echo "Production health endpoint did not become ready"
          exit 1

      - name: Check production health contract
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 60 'https://company-ai-0mya.onrender.com/healthz')"
          echo "$body"
          python - <<'PY' "$body"
          import json, sys
          data = json.loads(sys.argv[1])
          assert data.get("status") == "ok", data
          assert data.get("mode") == "production", data
          PY

      - name: Check production homepage and public assets
        run: |
          set -euo pipefail
          base='https://company-ai-0mya.onrender.com'
          curl --fail --silent --show-error --max-time 60 "$base/" -o /tmp/index.html
          grep -q 'Layan' /tmp/index.html
          curl --fail --silent --show-error --max-time 60 "$base/layan-realtime-hotfix.js?v=20260916-05" -o /tmp/layan.js
          test -s /tmp/layan.js
          curl --fail --silent --show-error --max-time 60 "$base/company-ai-live-bridge.js?v=20260916-05" -o /tmp/bridge.js
          test -s /tmp/bridge.js

      - name: Check production security headers
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 -D /tmp/headers.txt -o /dev/null 'https://company-ai-0mya.onrender.com/healthz'
          echo '--- production response headers ---'
          cat /tmp/headers.txt
          echo '--- security header evaluation ---'
          python - <<'PY'
          from pathlib import Path
          headers = {}
          for line in Path('/tmp/headers.txt').read_text(errors='replace').splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  headers[key.strip().lower()] = value.strip()
          required = {
              'x-content-type-options': 'nosniff',
              'x-frame-options': 'deny',
          }
          for key, expected in required.items():
              actual = headers.get(key, '')
              print(f'{key}: {actual or "MISSING"}')
              assert actual.lower() == expected.lower(), (key, actual)
          referrer = headers.get('referrer-policy', '')
          print(f'referrer-policy: {referrer or "MISSING"}')
          assert referrer.lower() in {'strict-origin-when-cross-origin', 'no-referrer'}, referrer
          csp = headers.get('content-security-policy', '')
          print(f'content-security-policy: {csp or "MISSING"}')
          assert csp, 'Content-Security-Policy is missing from the public production response'
          hsts = headers.get('strict-transport-security', '')
          print(f'strict-transport-security: {hsts or "MISSING"}')
          assert hsts, 'Strict-Transport-Security is missing from the public production response'
          PY
