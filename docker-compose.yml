services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: company_ai
      POSTGRES_USER: company_ai
      POSTGRES_PASSWORD: change-this-password
    volumes: [company_ai_pg:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://company_ai:change-this-password@db:5432/company_ai
      JWT_SECRET: change-this-in-production
      PASSWORD_PEPPER: change-this-in-production
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    image: nginx:alpine
    volumes: [./frontend:/usr/share/nginx/html:ro]
    ports: ["8080:80"]
volumes:
  company_ai_pg:
