services:
  - type: web
    name: company-ai-free-beta
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.realtime_entry:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://amjadj9090-ship-it.github.io
      - key: TRUSTED_HOSTS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_RATE_LIMIT
        value: "30"
